<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Players - RampartChess</title>
<link rel="icon" href="favicon.ico" />
<link rel="stylesheet" href="style.css?v=78" />
</head>
<body>
<header>
  <div id="headerLeft">
    <div id="navMenu">
      <button id="navMenuBtn" aria-label="Menu" title="Menu">&#9776;</button>
      <div id="navMenuDropdown" hidden>
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="stats.html">Stats</a>
        <a href="messages.html">Messages</a>
        <a href="players.html">Players</a>
        <a href="about.html">About</a>
        <a href="rules.html">Game Rules</a>
        <a href="legal.html">Terms &amp; Privacy</a>
      </div>
    </div>
    <a id="homeLink" href="index.html"><img id="siteLogo" src="assets/misc/logo_crown.png" alt=""><h1>RampartChess</h1></a>
  </div>
  <div id="accountHeader" hidden>
    <div id="notifBell">
      <button id="notifBtn" title="Notifications"><img class="bellIcon" src="assets/misc/bell.png" alt=""><span id="notifBadge" hidden>0</span></button>
      <div id="notifDropdown" hidden></div>
    </div>
    <div id="avatarMenu">
      <span id="headerUserLabel"></span>
      <!-- Wrapper so rating+trophies can be repositioned as a unit on
           mobile (see style.css) without affecting desktop, where this
           stays `display:contents` - i.e. invisible as a grouping,
           rating and trophy row behave exactly as if they were still
           direct children of #avatarMenu. -->
      <div id="headerMetaRow">
        <span id="headerRatingText"></span>
        <span id="headerTrophyRow" class="playerTrophyRow"></span>
      </div>
      <button id="avatarMenuBtn" title="Account">
        <img id="headerAvatarImg" alt="Avatar" hidden>
        <canvas id="headerAvatarCanvas" width="42" height="42" hidden></canvas>
      </button>
      <div id="avatarMenuDropdown" hidden>
        <a href="profile.html">Profile</a>
        <button id="headerLogOutBtn">Sign Out</button>
      </div>
    </div>
  </div>
</header>

<main id="playersPage">
  <section id="playersHero">
    <h2>Players</h2>
    <p id="playersSummary">&nbsp;</p>
  </section>

  <div id="playersToolbar">
    <div id="playersFilters" role="tablist" aria-label="Filter players">
      <button class="playersFilter active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="playersFilter" data-filter="online" role="tab" aria-selected="false">Online</button>
      <button class="playersFilter" data-filter="friends" role="tab" aria-selected="false" hidden>Friends</button>
    </div>
    <input id="playersSearch" type="search" placeholder="Search players..." aria-label="Search players">
  </div>

  <p id="playersSignedOutNote" hidden><a href="index.html">Log in</a> to challenge other players.</p>

  <ol id="podium" aria-label="Top three players"></ol>
  <ol id="playersList" aria-label="All players"></ol>
  <p id="playersEmpty" hidden></p>
</main>

<dialog id="challengeDialog">
  <form method="dialog" id="challengeForm">
    <h3 id="challengeDialogTitle">Challenge</h3>
    <div id="challengeDialogPlayer"></div>
    <label>Your color
      <select id="challengeDialogColor">
        <option value="random" selected>Random</option>
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>
    </label>
    <label>Time control
      <select id="challengeDialogTime">
        <option value="30min" selected>30 minutes</option>
        <option value="1hour">1 hour</option>
        <option value="1day_per_move">1 day per move</option>
      </select>
    </label>
    <p id="challengeDialogStatus" role="status"></p>
    <div id="challengeDialogButtons">
      <button type="button" id="challengeDialogCancel">Cancel</button>
      <button type="button" id="challengeDialogSend" class="primaryBtn">Send challenge</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/header.js"></script>
<script type="module" src="js/players.js"></script>
</body>
</html>
