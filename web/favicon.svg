<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 48 48" width="48" height="48">
<!-- Rampart tab icon: black crown on light browser themes, white on dark (favicon.ico is the black-only fallback). -->
<style>.dark{display:none}@media (prefers-color-scheme: dark){.light{display:none}.dark{display:inline}}</style>
<image class="light" width="48" height="48" xlink:href="data:image/png;base64,"/>
<image class="dark" width="48" height="48" xlink:href="data:image/png;base64,"/>
</svg>
