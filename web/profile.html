<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profile - RampartChess</title>
<link rel="icon" href="favicon.ico" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div id="headerLeft">
    <div id="navMenu">
      <button id="navMenuBtn" aria-label="Menu" title="Menu">&#9776;</button>
      <div id="navMenuDropdown" hidden>
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="stats.html">Stats</a>
        <a href="messages.html">Messages</a>
        <a href="rules.html">Game Rules</a>
        <a href="legal.html">Terms &amp; Privacy</a>
      </div>
    </div>
    <a id="homeLink" href="index.html"><img id="siteLogo" src="assets/misc/logo_crown.png" alt=""><h1>RampartChess</h1></a>
  </div>
  <div id="accountHeader" hidden>
    <div id="notifBell">
      <button id="notifBtn" title="Notifications"><img class="bellIcon" src="assets/misc/gothic_bell.png" alt=""><span id="notifBadge" hidden>0</span></button>
      <div id="notifDropdown" hidden></div>
    </div>
    <div id="avatarMenu">
      <span id="headerUserLabel"></span>
      <button id="avatarMenuBtn" title="Account">
        <img id="headerAvatarImg" alt="Avatar" hidden>
        <canvas id="headerAvatarCanvas" width="28" height="28" hidden></canvas>
      </button>
      <div id="avatarMenuDropdown" hidden>
        <a href="profile.html">Profile</a>
        <button id="headerLogOutBtn">Sign Out</button>
      </div>
    </div>
  </div>
</header>

<main id="profilePage">
  <div id="playerSearch">
    <input id="playerSearchInput" type="text" placeholder="Find a player by username...">
    <button id="playerSearchBtn">View</button>
  </div>

  <p id="signedOutMessage" hidden>Please sign in on the <a href="index.html">Home page</a> first.</p>

  <div id="profileContent" hidden>
    <div id="profileHeader">
      <div id="avatarWrap">
        <img id="avatarImg" alt="Avatar" hidden>
        <canvas id="avatarCanvas" width="128" height="128" hidden></canvas>
        <button id="avatarEditBtn" title="Change avatar">Edit</button>
        <input id="avatarFileInput" type="file" accept="image/*" hidden>
      </div>
      <div id="profileInfo">
        <h2 id="profileUsername"></h2>
        <p id="profileRating"></p>
        <div id="countryRow" hidden>
          <span id="countryLabel"></span>
          <button id="countryEditBtn">Edit country</button>
        </div>
        <div id="countryEditor" hidden>
          <select id="countrySelect"></select>
          <p id="extinctStateHint">Not finding your state? Try this menu:</p>
          <select id="extinctStateSelect"></select>
          <div id="countryEditorButtons">
            <button id="countrySaveBtn">Save</button>
            <button id="countryCancelBtn">Cancel</button>
          </div>
        </div>
        <div id="addFriendRow" hidden>
          <button id="addFriendBtn">Send Friend Request</button>
          <button id="acceptIncomingFriendBtn" hidden>Accept Friend Request</button>
          <button id="declineIncomingFriendBtn" hidden>Decline</button>
          <span id="addFriendStatus"></span>
        </div>
        <div id="bioDisplay">
          <p id="bioText"></p>
          <button id="bioEditBtn">Edit bio</button>
        </div>
        <div id="bioEditor" hidden>
          <textarea id="bioTextarea" maxlength="280" rows="3"></textarea>
          <div>
            <button id="bioSaveBtn">Save</button>
            <button id="bioCancelBtn">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <div id="profileFriendsSection" hidden>
      <h3>Friends</h3>
      <div id="profileFriendsList"></div>
    </div>

    <div id="badgesSection">
      <h3>Trophies</h3>
      <div id="badgesGrid"></div>
    </div>

    <h3>Games</h3>
    <div id="gamesLedger"></div>
  </div>
</main>

<script type="module" src="js/header.js"></script>
<script type="module" src="js/profile.js"></script>
</body>
</html>
